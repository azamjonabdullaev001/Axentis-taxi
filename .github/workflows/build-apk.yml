name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # можно запустить вручную с сайта GitHub

jobs:

  # ─── Пассажирское приложение ──────────────────────────────────────────────
  build-passenger:
    name: Passenger App APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Scaffold Android platform
        working-directory: axentis-taxi-flutter
        run: flutter create --project-name axentis_taxi --org com.axentis . --platforms android

      - name: Flutter pub get
        working-directory: axentis-taxi-flutter
        run: flutter pub get

      - name: Build APK
        working-directory: axentis-taxi-flutter
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: passenger-app-apk
          path: axentis-taxi-flutter/build/app/outputs/flutter-apk/app-release.apk

  # ─── Водительское приложение ──────────────────────────────────────────────
  build-driver:
    name: Driver App APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Scaffold Android platform
        working-directory: driver-app-flutter
        run: flutter create --project-name axentis_driver --org com.axentis . --platforms android

      - name: Flutter pub get
        working-directory: driver-app-flutter
        run: flutter pub get

      - name: Build APK
        working-directory: driver-app-flutter
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-app-apk
          path: driver-app-flutter/build/app/outputs/flutter-apk/app-release.apk
