services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: axentis_taxi
      POSTGRES_USER: axentis
      POSTGRES_PASSWORD: axentis_secret_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axentis -d axentis_taxi"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://axentis:axentis_secret_2026@db:5432/axentis_taxi?sslmode=disable
      JWT_SECRET: AxentisJWT2026SecretKey!
      PORT: "8080"
      OSRM_URL: http://osrm:5000
    ports:
      - "8181:8080"

  osrm:
    build:
      context: ./osrm
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - osrm_data:/data
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5000/nearest/v1/driving/69.2401,41.3111 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  osrm_data:
