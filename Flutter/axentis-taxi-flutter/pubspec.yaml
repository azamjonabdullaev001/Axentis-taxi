name: axentis_taxi
description: Axentis Taxi - Passenger App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.4

  # HTTP
  dio: ^5.4.3
  http: ^1.2.2

  # WebSocket
  web_socket_channel: ^2.4.0

  # Maps
  flutter_map: ^6.2.1
  latlong2: ^0.9.0

  # Location & Compass
  geolocator: ^11.0.0
  flutter_compass: ^0.7.0
  permission_handler: ^11.3.1

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Notifications
  firebase_messaging: ^14.9.4
  flutter_local_notifications: ^17.2.2

  # Utilities
  intl: ^0.19.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
